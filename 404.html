<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found!</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .container {
            text-align: center;
        }
        h1 {
            font-size: 4rem;
            color: #333;
            margin: 20px 0;
            animation: float 3s ease-in-out infinite;
        }
        p {
            font-size: 1.5rem;
            color: #666;
            margin: 10px 0;
            height: 4rem; /* 固定高度防止抖动 */
        }
        .emoji {
            font-size: 8rem;
            animation: spin 4s linear infinite;
            margin-bottom: 30px;
        }
        .text-container {
            display: inline-block;
            position: relative;
            height: 2rem;
            width: 100%; /* 强制容器宽度铺满 */
            text-align: center; /* 水平居中 */
        }
        .text-container span {
            position: absolute;
            left: 50%; /* 水平居中定位 */
            transform: translateX(-50%); /* 修正居中偏移 */
            opacity: 0;
            animation: switch-text 6s infinite;
            font-size: 1.5rem;
            color: #666;
            white-space: nowrap; /* 禁止文字换行 */
        }
        .text-container span:nth-child(1) {
            animation-delay: 0s;
        }
        .text-container span:nth-child(2) {
            animation-delay: 3s;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes switch-text {
            0%, 33% {
                opacity: 1;
                transform: translateX(-50%) translateY(0); /* 居中 + 无偏移 */
            }
            66%, 100% {
                opacity: 0;
                transform: translateX(-50%) translateY(20px); /* 居中 + 向下淡出 */
            }
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-20px); }
        }
        a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">😂</div>
        <h1>404</h1>
        <div class="text-container">
            <span>页面已经畏罪潜逃 ε=ε=ε=(~￣▽￣)~<br>Page has gone on the run</span>
            <span>躲在了互联网的某个角落<br>hiding somewhere on the internet</span>
        </div>
        <div>
            <p></p>
            <p>别担心，你可以回 <a href="./index.html">首页</a> 告诉我，或者试试报警👮把他抓回来🚓‍。</p>
            <p>Don't worry, you can go back <a href="./index.html">home page</a> to let me know, or call the police 👮 to get him back 🚓‍.</p>
        </div>
    </div>
</body>
</html>
