    <script>
    // 动态加载 Markdown 文件
    fetch('./cv.md')  //-- 修改对应页面！！！！！！！！！！！！！！！！
        .then(response => {
            if (!response.ok) {
                throw new Error('无法加载文件');
            }
            return response.text();
        })
        .then(markdown => {
            // 将 Markdown 渲染为 HTML
            document.getElementById('content').innerHTML = marked.parse(markdown);
        })
        .catch(error => {
            console.error('加载失败:', error);
            document.getElementById('content').innerHTML = '<p style="color: red;">加载失败，请检查控制台</p>';
        });
    </script>
